server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API — same-origin from the browser's perspective, nginx forwards
    # the full path (including /api) to the backend service unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP-over-SockJS: needs the WebSocket upgrade headers and a long
    # read timeout so the connection isn't dropped between telemetry ticks.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback so client-side routes (e.g. /machines/3) survive a direct
    # navigation or reload instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
