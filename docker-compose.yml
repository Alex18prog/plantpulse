services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantpulse}
      POSTGRES_USER: ${POSTGRES_USER:-plantpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantpulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantpulse} -d ${POSTGRES_DB:-plantpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plantpulse}
      DB_USER: ${POSTGRES_USER:-plantpulse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plantpulse}
      PLANTPULSE_JWT_SECRET: ${PLANTPULSE_JWT_SECRET:-dev-only-insecure-secret-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  postgres-data:
