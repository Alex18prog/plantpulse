spring:
  application:
    name: plantpulse

  profiles:
    active: dev

plantpulse:
  telemetry:
    interval-ms: 3000
  thresholds:
    temperature-warning: 75.0
    temperature-critical: 90.0
    vibration-warning: 6.0
    vibration-critical: 9.0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plantpulse;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plantpulse}
    username: ${DB_USER:plantpulse}
    password: ${DB_PASSWORD:plantpulse}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
