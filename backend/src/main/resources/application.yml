spring:
  application:
    name: plantpulse

  profiles:
    active: dev

plantpulse:
  cors:
    # Same ALLOWED_ORIGIN env var drives both; each keeps its own current
    # default so unset behavior is unchanged (REST was locked to localhost,
    # the WebSocket endpoint already allowed any origin).
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:*}
    ws-allowed-origin: ${ALLOWED_ORIGIN:*}
  telemetry:
    interval-ms: 3000
    sample-every-n-ticks: 10 # ~1 persisted reading every 30s at the default interval
    retention-hours: 48
    purge-interval-ms: 3600000 # 1h
  thresholds:
    temperature-warning: 75.0
    temperature-critical: 90.0
    vibration-warning: 6.0
    vibration-critical: 9.0
  preventive-maintenance:
    check-interval-ms: 60000 # 1 min; demo-friendly, the condition itself only changes daily
  security:
    # Dev-only default; override via PLANTPULSE_SECURITY_JWT_SECRET in prod.
    jwt-secret: ${PLANTPULSE_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-3f8a2c1e}
    jwt-expiration-ms: 28800000 # 8h, demo-friendly

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plantpulse;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plantpulse}
    username: ${DB_USER:plantpulse}
    password: ${DB_PASSWORD:plantpulse}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
